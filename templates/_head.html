<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="description" content="{{ ui.tagline }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{{ ui.icon }}</text></svg>">
<link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-icons.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>:root{--a1:{{ ui.accent1 }};--a2:{{ ui.accent2 }}}</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
